name: a11y

# The AA floor of this site is measured on rendered pixels, so it only holds
# while something keeps measuring. These are the same three commands documented
# in tools/a11y/README.md, run on every push to master and every pull request.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: contrast, reflow and structure
    runs-on: ubuntu-latest
    env:
      # Chrome's sandbox is unavailable on containerised runners.
      A11Y_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The S7 differential needs the parent commit to measure its baseline;
          # the default depth of 1 leaves HEAD~1 missing and the gate would
          # silently fall back to the absolute specs.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        # Pinned: the probe measures with Pillow's resampling and getdata(), so a
        # major release could shift a ratio without any page change.
        run: python -m pip install "pillow==11.3.0"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Reflow first: a page that scrolls sideways also distorts every rect the
      # contrast probe would sample.
      - name: WCAG 1.4.10 reflow gate, 320-1440px
        working-directory: tools/a11y
        run: python widths.py ci

      - name: WCAG 1.4.3 contrast and structure on rendered pixels
        working-directory: tools/a11y
        run: python probe.py ci

      # S7 compares rects against a baseline, and font metrics differ per
      # platform: measured, a win32 baseline on a linux runner turned a single
      # 52px nav push into two competing deltas (52 and 72) and flagged every
      # rect below the fold as a regression. So the baseline is measured here,
      # from the parent commit, with this runner's fonts and Chrome.
      - name: Baseline from the parent commit, same runner
        working-directory: tools/a11y
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "::error::HEAD~1 is missing; the S7 differential needs the parent commit (checkout fetch-depth)"
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/a11y-base" HEAD~1
          A11Y_PAGE="$RUNNER_TEMP/a11y-base/index.html" python probe.py ci-base

      - name: Acceptance spec, differential included
        working-directory: tools/a11y
        run: |
          set -euo pipefail
          # No silent fallback: if this file is missing the baseline step was
          # skipped, and a green run would lie about having diffed anything.
          test -f out/report-ci-base.json || {
            echo "::error::no same-runner baseline; S7 did not run"
            exit 1
          }
          python check.py ci ci-base

      - name: Keep the evidence when a gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports
          path: |
            tools/a11y/out/*.json
            tools/a11y/.work/*.png
          if-no-files-found: warn
